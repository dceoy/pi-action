---
name: Pi Coding Agent Action
description: Run the Pi coding agent in GitHub Actions workflows
branding:
  icon: terminal
  color: black
inputs:
  prompt:
    required: true
    description: Prompt to send to Pi in non-interactive print mode
  pi-version:
    required: false
    description: Exact Pi version to install, or latest to use the official installer
    # npm package: @earendil-works/pi-coding-agent
    default: '1.5.2'
  model:
    required: false
    description: Model to use, in provider/model format (e.g., anthropic/claude-opus-5). Empty uses Pi's default model.
    default: ''
  thinking:
    required: false
    description: Thinking level (off, minimal, low, medium, high, xhigh, max). Empty uses the model default.
    default: ''
  tools:
    required: false
    description: Comma-separated allowlist of tool names (e.g., read,grep,find,ls for a read-only run). Empty uses Pi's default tools.
    default: ''
  pr-loop-ref:
    required: false
    description: Full immutable pr-loop commit SHA supplying the skills
    default: 66193c0383663b48ea144b438d7dd4a42e02b6e2  # v1.1.5
  review-only:
    required: false
    description: Install only pinned pr-review, require an exact PR target and restrict the default toolset.
    default: 'false'
  timeout-minutes:
    required: false
    description: Maximum minutes to let Pi run before it is killed (uses 'timeout'/'gtimeout' when available; otherwise runs without an enforced timeout).
    default: '60'
runs:
  using: composite
  steps:
    # Exact semver validation and the default pin replace a lockfile for this user-selectable CLI.
    - name: Install Pi  # zizmor: ignore[adhoc-packages]
      shell: bash -euo pipefail {0}
      env:
        PI_VERSION: ${{ inputs.pi-version }}
      run: |
        if [[ "${PI_VERSION}" == "latest" ]]; then
          curl -fsSL https://pi.dev/install.sh | sh
        elif [[ "${PI_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$ ]]; then
          # An exact, validated version is intentional; callers may override the default pin.
          npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"
        else
          echo "::error::pi-version must be an exact semver or latest." >&2
          exit 1
        fi
    - name: Run Pi
      shell: bash -euo pipefail {0}
      env:
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        THINKING: ${{ inputs.thinking }}
        TOOLS: ${{ inputs.tools }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        PR_LOOP_REF: ${{ inputs.pr-loop-ref }}
        REVIEW_ONLY: ${{ inputs.review-only }}
        PR_LOOP_INSTALL_TOKEN: ${{ github.token }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: '"${{ github.action_path }}/scripts/run-pi.sh"'
