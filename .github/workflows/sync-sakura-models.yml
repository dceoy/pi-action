---
name: Sync Sakura AI Engine models
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync Sakura models
        run: scripts/sync-sakura-models.sh
        env:
          SAKURA_AI_ENGINE_API_KEY: ${{ secrets.SAKURA_AI_ENGINE_API_KEY }}
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ github.token }}
          commit-message: Sync Sakura AI Engine models
          title: Sync Sakura AI Engine models
          branch: github-actions/sakura-models
          base: ${{ github.event.repository.default_branch }}
          labels: agent:github-actions
          delete-branch: true
          body: Update `config/sakura-models.json` from the Sakura AI Engine model catalog after probing chat completions.
